name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: make
      - name: Unit testler
        run: make test
      - name: Uygulama testleri
        run: make test-app
      - name: macOS uygulaması
        run: make app
      - name: Bütünleşik testler
        run: make test-integration
