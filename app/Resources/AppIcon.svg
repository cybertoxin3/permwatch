<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3556c9"/>
      <stop offset="0.55" stop-color="#1b2b6e"/>
      <stop offset="1" stop-color="#0c1435"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#7f9bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7f9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6d2ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#e5312a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#050a20" flood-opacity="0.55"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- macOS ikon zemini -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- tarama çizgileri -->
    <g stroke="#9fb3ff" stroke-opacity="0.08" stroke-width="3">
      <path d="M100 300 H924 M100 420 H924 M100 540 H924 M100 660 H924 M100 780 H924"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="url(#rim)"/>
  </g>

  <!-- kalkan -->
  <path filter="url(#shadow)" fill="url(#shield)"
        d="M512 236 L726 312 C736 316 742 325 742 336 V500
           C742 650 650 752 522 806 C516 808 508 808 502 806
           C374 752 282 650 282 500 V336 C282 325 288 316 298 312 Z"/>

  <!-- göz -->
  <path fill="#14215a" d="M362 516 C410 438 460 404 512 404 C564 404 614 438 662 516 C614 594 564 628 512 628 C460 628 410 594 362 516 Z"/>
  <circle cx="512" cy="516" r="78" fill="url(#iris)"/>
  <circle cx="512" cy="516" r="34" fill="#14215a"/>
  <circle cx="488" cy="490" r="14" fill="#ffffff" fill-opacity="0.9"/>
</svg>
